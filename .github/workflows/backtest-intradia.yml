name: Backtest intradiário

# Só à mão. Estudos extra dos rompimentos:
#   intradia     momento de entrada com preços de hora a hora (passo3b_intradia.py)
#   rompimentos  filtros de vários tempos gráficos e setups novos (passo3c_rompimentos.py)
#   confianca    treina e valida a confiança calibrada (passo3d_confianca.py)
#   trocas       vale a pena trocar uma posição por um sinal novo? (passo3e_trocas.py)
#   forca        o que deve ditar a força/ordem dos sinais? (passo3f_forca.py)
#   reavaliar    força de um sinal com o passar dos dias e do preço (passo3g_reavaliar.py)
#   abertura     sinais da noite: comprar à abertura seguinte com salto (passo3h_abertura.py)
#   risco        que sinais perdem mais quando correm mal? (passo3i_risco.py)
#   ordem        ordem dos sinais: ganho esperado ou ajustado ao risco? (passo3j_ordem.py)
#   saidas_risco prazo mais curto e stop que sobe para a entrada (passo3k_saidas_risco.py)
#   spread       spread estimado: cortar ou reordenar sinais caros de entrar? (passo3l_spread.py)
#   europa       os setups rendem na Europa depois dos custos da XTB? (passo3m_europa.py)
#   recalcular   recalcular o sinal "do zero" todos os dias diz melhor quanto ainda vale? (passo3o_recalcular.py)
#   regime       os sinais rendem pior com o mercado a cair? SPY/QQQ, VIX, amplitude, força relativa (passo3p_regime.py)
#   skills       ideias das skills de day trading: setups do scanner e travão de perdas (passo3q_skills.py)
#   vendas       vendas a descoberto (CFD) com o mercado fraco (passo3r_vendas.py)
#   restritas    mercado fraco: só compras de capitulação em vez de parar; vender o índice (passo3s_restritas.py)
#   dados        resultados das empresas, setor e força contra o mercado, para compras e vendas (passo3t_dados.py)
#   biblioteca   muitas regras de compra e venda, cada uma por tipo de mercado (passo3u_biblioteca.py)
#   biblioteca10 o mesmo com 10 anos de preços do Yahoo (1500 ações dos EUA mais negociadas)
on:
  workflow_dispatch:
    inputs:
      estudo:
        description: "Que estudo correr"
        type: choice
        options: [rompimentos, intradia, confianca, trocas, forca, reavaliar, abertura, risco, ordem, saidas_risco, spread, europa, recalcular, regime, skills, vendas, restritas, dados, biblioteca, biblioteca10]
        default: rompimentos

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ler os preços guardados pelos sinais
        uses: actions/cache/restore@v4
        with:
          path: |
            data/precos.parquet
            data/universo.csv
            data/universo_filtrado.csv
            data/universo_atualizado_em.txt
            data/avaliacoes_cache.json
          key: dados-nenhum
          restore-keys: dados-
      - run: python passo3b_intradia.py
        if: inputs.estudo == 'intradia'
      - run: python passo3c_rompimentos.py
        if: inputs.estudo == 'rompimentos'
      - run: python passo3d_confianca.py
        if: inputs.estudo == 'confianca'
      - run: python passo3e_trocas.py
        if: inputs.estudo == 'trocas'
      - run: python passo3f_forca.py
        if: inputs.estudo == 'forca'
      - run: python passo3g_reavaliar.py
        if: inputs.estudo == 'reavaliar'
      - run: python passo3h_abertura.py
        if: inputs.estudo == 'abertura'
      - run: python passo3i_risco.py
        if: inputs.estudo == 'risco'
      - run: python passo3j_ordem.py
        if: inputs.estudo == 'ordem'
      - run: python passo3k_saidas_risco.py
        if: inputs.estudo == 'saidas_risco'
      - run: python passo3l_spread.py
        if: inputs.estudo == 'spread'
      - run: python passo3m_europa.py
        if: inputs.estudo == 'europa'
      - run: python passo3o_recalcular.py
        if: inputs.estudo == 'recalcular'
      - run: python passo3p_regime.py
        if: inputs.estudo == 'regime'
      - run: python passo3q_skills.py
        if: inputs.estudo == 'skills'
      - run: python passo3r_vendas.py
        if: inputs.estudo == 'vendas'
      - run: python passo3s_restritas.py
        if: inputs.estudo == 'restritas'
      - run: python passo3t_dados.py
        if: inputs.estudo == 'dados'
      - run: python passo3u_biblioteca.py
        if: inputs.estudo == 'biblioteca'
      - run: python passo3u_biblioteca.py
        if: inputs.estudo == 'biblioteca10'
        env: {ANOS: "10", ACOES: "1500"}
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-intradia
          path: |
            data/backtest_intradia.csv
            data/estudo_rompimentos.csv
