name: Alertas do analista

on:
  schedule:
    - cron: "5,35 7-21 * * 1-5"   # reserva; quem lança de 10 em 10 min é o relogio.yml (07:05 a 21:55 UTC), dias úteis (abertura da Europa ao fecho dos EUA)
  workflow_dispatch:           # permite correr à mão no separador Actions
    inputs:
      backtest:
        description: "Correr também o backtest (demora ~18 min)"
        type: boolean
        default: false

permissions:
  contents: write              # para guardar o histórico de sinais

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recuperar preços guardados da execução anterior
        uses: actions/cache@v4
        with:
          path: |
            data/precos.parquet
            data/universo.csv
            data/universo_filtrado.csv
            data/universo_atualizado_em.txt
            data/avaliacoes_cache.json
          key: dados-${{ github.run_id }}
          restore-keys: dados-
      - name: Correr o modelo e enviar alertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELO_CLAUDE: ${{ secrets.MODELO_CLAUDE }}   # vazio = claude-haiku-5-5
          CARTEIRA_CHAVE: ${{ secrets.CARTEIRA_CHAVE }} # só leitura da carteira (tamanho por sinal)
        run: python diario.py
      - name: Guardar histórico de sinais
        run: |
          git config user.name "analista-bot"
          git config user.email "analista-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Sinais de $(date -u +%F)"
          git pull --rebase --quiet || true
          git push
      - name: Avisar no Telegram se falhar
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ O analista falhou nesta execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  backtest:
    if: github.event_name == 'workflow_dispatch' && inputs.backtest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recuperar preços guardados
        uses: actions/cache/restore@v4
        with:
          path: |
            data/precos.parquet
            data/universo.csv
            data/universo_filtrado.csv
          key: dados-${{ github.run_id }}
          restore-keys: dados-
      - run: test -f data/precos.parquet || python passo1_universo.py
      - run: python passo3_backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: data/backtest_*.csv
