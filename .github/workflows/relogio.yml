name: Relógio

# O agendamento (cron) do GitHub falha ou atrasa muito em repositórios novos.
# Este "relógio" fica ligado e lança os sinais (diario.yml) às :05 e :35 das 07 às 21 UTC
# e os resumos (resumos.yml) às 06:35, 20:35 e 21:35 UTC, nos dias úteis.
# Um job só pode durar 6 h, por isso ao fim de ~5h40 relança-se a si próprio.
# O cron abaixo só serve para o reacender se a cadeia alguma vez parar.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  actions: write

concurrency:
  group: relogio
  cancel-in-progress: false

jobs:
  relogio:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Lançar o analista de 30 em 30 minutos
        run: |
          fim=$(( $(date +%s) + 340*60 ))
          ultimo=""
          while [ "$(date +%s)" -lt "$fim" ]; do
            dia=$(date -u +%u); h=$(date -u +%-H); m=$(date -u +%-M)
            slot="$(date -u +%Y%m%d%H)-$m"
            if [ "$dia" -le 5 ] && { [ "$m" -eq 5 ] || [ "$m" -eq 35 ]; } && [ "$slot" != "$ultimo" ]; then
              ultimo=$slot
              # Sinais: 07:05 a 21:35 UTC
              if [ "$h" -ge 7 ] && [ "$h" -le 21 ]; then
                echo "$(date -u) a lançar diario.yml"
                gh workflow run diario.yml -R "$REPO" --ref main || echo "falhou o lançamento dos sinais"
              fi
              # Resumos (à parte): abertura às 06:35; fecho às 20:35 e 21:35 (o script escolhe a certa)
              if [ "$h" -eq 6 ] && [ "$m" -eq 35 ]; then
                gh workflow run resumos.yml -R "$REPO" --ref main -f tipo=manha || echo "falhou o resumo da manhã"
              fi
              if { [ "$h" -eq 20 ] || [ "$h" -eq 21 ]; } && [ "$m" -eq 35 ]; then
                gh workflow run resumos.yml -R "$REPO" --ref main -f tipo=fecho || echo "falhou o resumo do fecho"
              fi
            fi
            sleep 20
          done
      - name: Passar o testemunho ao próximo relógio
        if: ${{ !cancelled() }}   # cancelar à mão desliga o relógio
        run: gh workflow run relogio.yml -R "$REPO" --ref main
