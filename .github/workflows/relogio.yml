name: Relógio

# O agendamento (cron) do GitHub falha ou atrasa muito em repositórios novos.
# Também avisa o dono se os sinais falharem ou pararem (às :20 e :50).
# Este "relógio" fica ligado e lança os sinais (diario.yml) de 10 em 10 min (:05, :15, ... :55) das 07 às 21 UTC
# e os resumos (resumos.yml) às 06:35, 20:35 e 21:35 UTC, nos dias úteis.
# Um job só pode durar 6 h, por isso ao fim de ~5h40 relança-se a si próprio.
# O cron abaixo só serve para o reacender se a cadeia alguma vez parar.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  actions: write

concurrency:
  group: relogio
  cancel-in-progress: false

jobs:
  relogio:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}     # só para avisar o dono (bot da Carteira relançado, sinais parados)
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Lançar o analista de 10 em 10 minutos
        run: |
          fim=$(( $(date +%s) + 340*60 ))
          ultimo=""
          avisado=""
          # Vigilante: às :20 e :50 vê se os sinais estão a correr (parados há 35 min ou 2 falhas seguidas); avisa só o dono, no máximo 1 vez por hora.
          avisar() {
            [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || return 0
            curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=⚠️ <b>Aviso do sistema</b>
          $1" || true
          }
          vigiar() {
            linha=$(gh run list -R "$REPO" -w diario.yml -L 5 --json status,conclusion,createdAt \
              -q '[.[] | select(.status == "completed")] | "\(.[0].conclusion)\(if .[1].conclusion == "failure" then "" else "-1" end) \(.[0].createdAt)"' 2>/dev/null) || return 0
            [ -n "$linha" ] || return 0
            conclusao=${linha%% *}; criada=${linha#* }
            idade=$(( ( $(date +%s) - $(date -d "$criada" +%s) ) / 60 ))
            if [ "$idade" -gt 35 ]; then
              avisar "Os sinais não terminam uma corrida há ${idade} min. O relógio continua a lançá-los; vê o separador Actions no GitHub."
              avisado=$(date -u +%Y%m%d%H)
            elif [ "$conclusao" = "failure" ]; then
              avisar "As duas últimas corridas dos sinais falharam. O relógio continua a tentar de 10 em 10 min; se continuar, vê o separador Actions no GitHub."
              avisado=$(date -u +%Y%m%d%H)
            fi
          }
          ultimo_vigia=""
          ultimo_v=""
          while [ "$(date +%s)" -lt "$fim" ]; do
            dia=$(date -u +%u); h=$(date -u +%-H); m=$(date -u +%-M)
            slot="$(date -u +%Y%m%d%H)-$m"
            if [ "$dia" -le 5 ] && [ $(( m % 10 )) -eq 5 ] && [ "$slot" != "$ultimo" ]; then
              ultimo=$slot
              # Sinais: 07:05 a 21:55 UTC, de 10 em 10 min
              if [ "$h" -ge 7 ] && [ "$h" -le 21 ]; then
                echo "$(date -u) a lançar diario.yml"
                gh workflow run diario.yml -R "$REPO" --ref main || echo "falhou o lançamento dos sinais"
              fi
              # Resumos (à parte): abertura às 06:35; fecho às 20:35 e 21:35 (o script escolhe a certa)
              if [ "$h" -eq 6 ] && [ "$m" -eq 35 ]; then
                gh workflow run resumos.yml -R "$REPO" --ref main -f tipo=manha || echo "falhou o resumo da manhã"
              fi
              if { [ "$h" -eq 20 ] || [ "$h" -eq 21 ]; } && [ "$m" -eq 35 ]; then
                gh workflow run resumos.yml -R "$REPO" --ref main -f tipo=fecho || echo "falhou o resumo do fecho"
              fi
            fi
            if [ "$dia" -le 5 ] && { [ "$m" -eq 20 ] || [ "$m" -eq 50 ]; } && [ "$h" -ge 8 ] && [ "$h" -le 21 ] \
               && [ "$(date -u +%Y%m%d%H)" != "$avisado" ] && [ "$slot" != "$ultimo_v" ]; then
              ultimo_v=$slot
              vigiar
            fi
            # Vigia: de 10 em 10 min, a qualquer hora, confirma que o bot da Carteira está ligado.
            # O cron do GitHub não dispara neste repositório: se o bot cair, só isto o volta a ligar.
            # Desativar o workflow "Carteira" desliga-o de vez (não é relançado).
            if [ $(( m % 10 )) -eq 0 ] && [ "$slot" != "$ultimo_vigia" ]; then
              ultimo_vigia=$slot
              ativo=$(gh api "repos/$REPO/actions/workflows/carteira.yml" -q .state 2>/dev/null || echo "?")
              vivos=$(gh run list -w carteira.yml -R "$REPO" -L 10 --json status \
                        -q '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo "?")
              if [ "$ativo" = "active" ] && [ "$vivos" = "0" ]; then
                echo "$(date -u) bot da Carteira parado: a relançar"
                if gh workflow run carteira.yml -R "$REPO" --ref main; then
                  curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                    --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                    --data-urlencode "text=🔧 O bot da Carteira tinha parado; voltei a ligá-lo. Mensagens enviadas entretanto são respondidas agora." > /dev/null || true
                fi
              fi
            fi
            sleep 20
          done
      - name: Passar o testemunho ao próximo relógio
        if: ${{ !cancelled() }}   # cancelar à mão desliga o relógio
        run: gh workflow run relogio.yml -R "$REPO" --ref main
