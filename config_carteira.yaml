# Bot da Carteira (bot_carteira.py, workflow "Carteira"). Módulo à parte dos sinais.
regras_base:            # regras de cada carteira nova (cada pessoa muda as suas com /capital e /regras)
  capital_inicial: 100  # na moeda abaixo
  pct: 20               # % do valor da carteira por sinal
  max_posicoes: 5
  moeda: USD
  mercados: [eua]       # conta USD na XTB: só ações dos EUA
  custo_pct: 0.0        # custo por lado (%): 0 na subconta USD; 0.5 se comprares ações em USD com conta EUR
  ordem_minima: 5       # abaixo disto não sugere compra
lembrete_utc: "20:45"   # dias úteis: pergunta pelos sinais do dia sem resposta
resumo_manha_ny: "09:00"    # dias úteis, hora de Nova Iorque: resumo da manhã de cada pessoa (desliga-se em Avisos)
resumo_semanal_utc: "21:10"  # sexta, depois do fecho de Nova Iorque: a semana de cada pessoa
vigia_precos_seg: 120   # com a bolsa dos EUA aberta, preço de agora (Nasdaq) das posições e aviso de stop/objetivo
max_pendentes: 20       # pedidos de acesso à espera de aprovação
aviso: "Isto é uma ferramenta de apoio, não é aconselhamento financeiro. Decides e executas tu na tua corretora."
# Talão com caixas de texto que abre dentro do Telegram (docs/talao.html, publicado pelo workflow "Página do talão").
# Vazio = só os botões de escrever.
talao_url: "https://diogopestana01.github.io/analista-acoes/talao.html"
