# Configuração do universo de ações e dos filtros de liquidez.
universo:
  eua: true            # todas as ações listadas na NASDAQ, NYSE e NYSE American
  europa:              # índices europeus usados como aproximação da oferta da XTB
    - DAX
    - MDAX
    - CAC40
    - FTSE100
    - FTSE250
    - AEX
    - IBEX35
    - FTSEMIB
    - SMI
    - PSI
    - BEL20
    - OMXS30

filtro_liquidez:
  preco_minimo: 5.0              # na moeda local
  volume_medio_minimo_eur: 2000000  # valor médio negociado por dia (20 dias)
  dias_historico_minimo: 120

precos:
  periodo: "2y"         # histórico descarregado na primeira vez
  lote: 200             # tickers por pedido ao Yahoo Finance (histórico completo)
  lote_rapido: 1000     # tickers por pedido nas atualizações de hora a hora

sinais:
  setups: [rompimento, pullback, semana_forte, caiu_10, reversao_queda, medo_vix, viragem_mes, contra_setor, lider_recuo]   # medo_vix, viragem_mes, contra_setor, lider_recuo: estudos passo3v_avancado.py + passo3w_carteira.py (10 anos, carteira 5 lugares +55,7%|+56,3% contra -22,1%|+47,9%), precisam de src/contexto.py. caiu_10 e reversao_queda: estudo passo3u_biblioteca.py (10 anos), só no seu mercado (regime.so_em). semana_forte: estudo 28/10 +0,53% (4969 trades), positivo nas duas metades. rompimento_baixa (venda via CFD) desligado: backtest 2024-26 com retorno médio -0,33%
  mult_objetivo: 2.0     # só para setups de venda; as compras usam a regra de saída do setup (qualidade.*.saida)
  mult_stop: 1.0
  max_dias: 5            # horizonte máximo (dias úteis)
  retorno_minimo_pct: 1.0       # fasquia: retorno médio esperado após custos (%) para um sinal ser enviado
  peso_base_casos: 10           # quantos casos "vale" a média do setup face ao histórico da própria ação
  peso_backtest_casos: 150      # quantos sinais reais em papel "vale" o backtest na média de cada setup (ajuste automático).
                                # Era 30: uma semana boa de pullbacks punha a base em +1,22% (backtest +0,42%). Revisão 29/10.
  # Lista de sinais: deixa de dar para comprar quando o preço já está mais de k ATR acima do preço do sinal
  # (sinais da noite: acima do fecho em que se formou). Estudo 30/10 passo3h_abertura.py, nas duas metades:
  # pullback a 0,2-0,5 ATR acima rende +0,18% (não paga o spread); rompimento/semana forte ainda +0,4%;
  # acima de 0,5 ATR ~0% em todos.
  # Probabilidade de ganhar de cada setup (backtest, período de teste) para a ordem equilibrada da lista
  # (src/lista_sinais.ordenar: ganho esperado + probabilidade de ganhar; estudo passo3j_ordem.py).
  ganha_setup: {pullback: 0.48, rompimento: 0.48, semana_forte: 0.48, caiu_10: 0.63, reversao_queda: 0.64, medo_vix: 0.72, viragem_mes: 0.68, contra_setor: 0.60, lider_recuo: 0.51}
  # Regime do mercado (src/regime.py; estudos passo3p_regime.py e passo3q_skills.py, aprovado 6/11):
  # sem compras novas nos EUA com menos de 50% das ações acima da média de 50 dias (exceto as regras que valem
  # no mercado fraco). O travão de perdas foi desligado a 7/11. Carteira de 5 lugares
  # no histórico: +16,0%|+24,0% (pior queda -12%) contra +3,8%|-0,9% (-26%). Tirar a chave = desligar.
  regime:
    amplitude_min: 0.5
    # travão de perdas DESLIGADO a pedido do Pestana (7/11: "não quero ter isso"). Para voltar a ligar:
    # travao: {perda: 0.05, janela_dias: 7, pausa_dias: 5, carteira: "5", desde: "AAAA-MM-DD"}
    capitulacao: {spy_5d: -0.03, setups: [pullback, reversao_queda, medo_vix, viragem_mes, contra_setor]}
    # Setups que só valem num tipo de mercado (forte: amplitude >= amplitude_min; queda: SPY 5 dias < spy_5d;
    # fraco: o resto). Estudo passo3u_biblioteca.py, 10 anos: carteira 5 lugares +41,2%|+63,3% com estes contra
    # -35,9%|+10,4% só com os de antes. Aprovado pelo Pestana a 6/11.
    so_em: {caiu_10: [forte], reversao_queda: [queda], medo_vix: [forte, fraco, queda], viragem_mes: [fraco, queda], contra_setor: [forte, queda], lider_recuo: [forte]}   # SPY a cair > 3% em 5 dias: pullbacks passam (estudo passo3s_restritas.py, variante E)
  # Europa (estudo passo3m_europa.py, 30/10): só ações em EUR e só rompimentos (+0,47% depois do spread,
  # positivo nas 2 metades). Pullback em EUR -0,08%; Londres/Estocolmo/Suíça negativos com o câmbio de 0,5%/lado.
  europa: {zonas: [euro], setups: [rompimento]}
  # Spread medido acima disto -> o sinal não aparece para comprar (estudo passo3l_spread.py: cortar >1% ganha
  # nas duas metades da carteira de 5 lugares, +30%/+13% contra +17%/-6,5% sem corte).
  spread_max: 0.01
  limite_compra_atr: {pullback: 0.2, rompimento: 0.5, semana_forte: 0.5, caiu_10: 0.2, reversao_queda: 0.2, medo_vix: 0.2, viragem_mes: 0.2, contra_setor: 0.2, lider_recuo: 0.2}
  qualidade:                    # média do backtest por setup (bruta, %), regra de saída (src/saidas.py) e filtros [mín, máx]
    pullback: {retorno_base_pct: 0.77, saida: fecho_10, filtros: {}}      # 10 anos (passo3y): fecho_10 +0,47% líq. (+0,45|+0,50) vs sma5 -0,02%
    # Rompimento e semana forte: só se o gráfico SEMANAL não estiver esticado (RSI semanal < 70).
    # Estudo 28/10 (passo3c_rompimentos.py): rompimento +0,64%/+0,07% (1.ª/2.ª metade) -> +0,66%/+0,22% com o
    # filtro; os de RSI semanal >= 70 deram -0,30% na 2.ª metade. Semana forte: +0,86%/+0,17% -> +0,89%/+0,24%.
    rompimento: {retorno_base_pct: 0.96, saida: fecho_10, filtros: {rsi_semanal: [null, 70]}}
    semana_forte: {retorno_base_pct: 1.74, saida: fecho_10, filtros: {rsi_semanal: [null, 70]}}
    # 10 anos (1500 ações dos EUA, líquido de 0,3%): caiu_10 no mercado forte +0,68%|+0,93%, ganha 63%;
    # reversao_queda (RSI2, duplo 7, 3 dias a cair, IBS, Bollinger, caiu 10%) na queda: +0,1% a +1,6%, ganha 63-66%.
    caiu_10: {retorno_base_pct: 1.1, saida: sma5, filtros: {}}
    reversao_queda: {retorno_base_pct: 1.0, saida: sma5, filtros: {}}
    # Estudo passo3v_avancado.py (10 anos, líquido de 0,3%, 1.ª|2.ª metade), saída sma5:
    # medo_vix fraco +0,95|+2,08, queda +1,35|+3,44; viragem_mes fraco +0,62|+0,36, queda +0,87|+1,00;
    # contra_setor (-15 pts) forte +0,57|+0,98, queda +0,28|+1,25; lider_recuo forte +0,26|+0,73.
    medo_vix: {retorno_base_pct: 1.8, saida: sma5, filtros: {}}
    viragem_mes: {retorno_base_pct: 0.9, saida: sma5, filtros: {}}
    contra_setor: {retorno_base_pct: 1.1, saida: sma5, filtros: {}}
    lider_recuo: {retorno_base_pct: 1.57, saida: fecho_10, filtros: {}}
    gap_volume: {retorno_base_pct: 0.19, filtros: {}}
    gap_continuacao: {retorno_base_pct: 0.04, filtros: {}}   # backtest 2024-26: +0,04% (738 trades), desligado
  filtro_queda_com_noticia: false   # true = retira pullbacks cuja queda tem notícia concreta (fica registado no CSV)
  evitar_resultados_dias: 2     # não envia sinais (EUA) de empresas com resultados até 2 dias úteis à frente
  avisar_resultados_dias: 5     # de 3 a 5 dias úteis (dentro do prazo do trade) o sinal sai com a data e um aviso
  pausa_apos_fecho_dias: 3      # uma ação fechada (objetivo, stop ou saída) não dá novo sinal durante 3 dias úteis
  max_candidatos_noticias: 40   # quantas ações passam à análise de notícias
  noticias_decidem: false       # false = modo sombra: a leitura do Claude só anota (não apaga nem reordena sinais)
                                # até o registo em papel mostrar que acerta (rever no fim do mês de validação)
  peso_noticias: 15             # só com noticias_decidem: pontos máximos somados/subtraídos pelas notícias
  max_alertas: 15               # limite de segurança contra excesso de mensagens
  custo_cambio_pct_por_lado: 0.0   # 0: ações dos EUA negociadas na subconta USD da XTB (sem câmbio por trade). Sem subconta: 0.5


investigador:            # "advogado do diabo": um segundo Claude procura razões para não comprar
  ativo: true
  bloquear: false        # false = só avisa no alerta e regista; true = retira os sinais com veredicto "rejeitar"

vigia:                   # notícias de risco novas sobre posições abertas (src/vigia.py), uma vez por hora
  ativo: true            # o alerta "vende já" vai só para o dono enquanto o bot não o encaminhar a cada pessoa

tendencias:              # Reddit (ApeWisdom) e StockTwits no alerta, só como informação (src/tendencias.py)
  ativo: true

# Gestão das posições de cada pessoa (avisos de stop/objetivo, saídas do registo, resultados, trocas).
# false: os sinais (diario.py) também a fazem. true: só a Carteira (bot sempre ligado), que lê
# data/lista_sinais.json; assim os avisos não dependem das notícias nem do tempo de cada corrida.
gestao:
  no_bot: true

# Saúde: avisa o dono se uma corrida dos sinais passar deste tempo (o ciclo é de 10 min).
saude:
  corrida_max_min: 8

# Sinais em teste (src/em_teste.py, estudo passo3u_biblioteca.py, aprovado pelo Pestana a 6/11): regras novas
# com alerta à parte só para o dono, fora dos lugares do modelo, cada uma só no mercado onde ganhou nas duas
# metades. Registo em papel em data/sinais_teste.csv. ligado: false desliga.
em_teste:
  ligado: false         # 6/11: as regras passaram para o modelo (setups caiu_10 e reversao_queda)
  janela_min: 40        # alertas nos últimos 40 min de NY (o estudo entra ao fecho)
  max_por_dia: 5
  ordem: rsi2           # RSI de 2 dias mais baixo primeiro (estudo: o único que não perde numa das metades)
  amplitude_min: 0.5
  queda_spy_5d: -0.03
  regras:
    forte: [caiu_10_5d]
    queda: [rsi2_10, rsi2_5, duplo_7, tres_quedas, ibs_baixo, bollinger, caiu_10_5d, dia_interior]
